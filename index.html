<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E13" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Асистент" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Асистент трейдера</title>
    <style>
      /* Базові стилі: без них у body білий відступ, а довгий текст розпирає сторінку на телефоні. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #0b0e13;
        color: #e8ebf0;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        overflow-x: hidden;
        overflow-wrap: anywhere;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100dvh;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        max-width: 100%;
      }
      button {
        touch-action: manipulation;
      }
      code {
        white-space: pre-wrap;
      }
      /* Жива ціна: пульсуюча точка. */
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(46, 189, 133, 0.6); }
        70% { box-shadow: 0 0 0 8px rgba(46, 189, 133, 0); }
        100% { box-shadow: 0 0 0 0 rgba(46, 189, 133, 0); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes shimmer {
        from { background-position: -200px 0; }
        to { background-position: 200px 0; }
      }
      .rise { animation: rise 0.35s ease-out both; }
      .spin { animation: spin 3s linear infinite; }
      .press { transition: transform 0.12s ease, border-color 0.2s ease; }
      .press:active { transform: scale(0.98); }
      .skeleton {
        border-radius: 10px;
        background: linear-gradient(90deg, #1b212b 0%, #262d39 50%, #1b212b 100%);
        background-size: 400px 100%;
        animation: shimmer 1.2s linear infinite;
      }
      .scroll-x { overflow-x: auto; scrollbar-width: none; }
      .scroll-x::-webkit-scrollbar { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .rise, .skeleton, .spin { animation: none; }
        .press { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
